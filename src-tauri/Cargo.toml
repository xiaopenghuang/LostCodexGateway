[package]
name = "lostcodexgateway"
version = "0.4.3"
description = "LostCodexGateway - 官方 Codex 客户端的专用网络出口管理器"
authors = ["LostCodexGateway"]
edition = "2021"

[lib]
name = "lostcodexgateway_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread", "net", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["socks", "rustls-tls", "json"] }
thiserror = "2"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
